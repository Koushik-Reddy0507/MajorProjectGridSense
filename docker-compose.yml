version: '3.8'

services:
  # ============ Frontend (React + Vite) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - gridsense

  # ============ Backend (FastAPI) ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - backend_models:/app/models
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    networks:
      - gridsense

  # ============ Redis (Caching & Background Jobs) ============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - gridsense

  # ============ Metabase (Analytics & Dashboards - No Tokens) ============
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_ADMIN_EMAIL=${METABASE_ADMIN_EMAIL:-admin@gridsense.io}
      - MB_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD:-gridsense123}
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
    networks:
      - gridsense

  # ============ PostgreSQL (Local fallback for development) ============
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gridsense
      - POSTGRES_USER=gridsense
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gridsense}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gridsense

  # ============ MinIO (S3-compatible storage for datasets) ============
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-gridsense}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-gridsense123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gridsense

networks:
  gridsense:
    driver: bridge

volumes:
  redis_data:
  metabase_data:
  pg_data:
  minio_data:
  backend_models:
  backend_logs: