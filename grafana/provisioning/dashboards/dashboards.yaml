apiVersion: 1

providers:
  - name: 'GridSense Dashboards'
    orgId: 1
    folder: 'GridSense'
    folderUid: 'gridsense'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards